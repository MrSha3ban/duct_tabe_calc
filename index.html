<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوبرماركت عبد الجليل - طلب أوردر</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #1b4332;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        .header p {
            color: #555;
            margin: 0;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #2b2b2b;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #25d366;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }
        .footer-note {
            font-size: 12px;
            color: #777;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛒 سوبرماركت عبد الجليل</h1>
        <p>اكتب طلباتك وستصلك إلى باب المنزل</p>
    </div>

    <form id="orderForm" onsubmit="sendOrder(event)">
        
        <div class="form-group">
            <label for="customerName">الاسم الكريم:</label>
            <input type="text" id="customerName" placeholder="أدخل اسمك الكامل" required>
        </div>

        <div class="form-group">
            <label for="customerPhone">رقم الهاتف:</label>
            <input type="tel" id="customerPhone" placeholder="رقم الموبايل للتواصل" required>
        </div>

        <div class="form-group">
            <label for="customerAddress">العنوان بالتفصيل:</label>
            <input type="text" id="customerAddress" placeholder="المنطقة، الشارع، رقم العمارة، الشقة" required>
        </div>

        <div class="form-group">
            <label for="orderItems">الأصناف المطلوبة والكميات:</label>
            <textarea id="orderItems" placeholder="اكتب الاصناف والكميات هنا، مثلاً:
- 2 كيلو سكر
- 1 زجاجة زيت
- 3 علب جبنة
- 5 أكياس مكرونة" required></textarea>
        </div>

        <button type="submit" class="btn-whatsapp">
            إرسال الطلب عبر الواتساب 📱
        </button>
    </form>
    
    <div class="footer-note">سيتم تحويلك مباشرة إلى الواتساب لإرسال الطلب.</div>
</div>

<script>
    // عند تحميل الصفحة، يتم استرجاع بيانات العميل إذا كانت محفوظة من قبل
    window.onload = function() {
        if (localStorage.getItem('abdelgaleel_name')) {
            document.getElementById('customerName').value = localStorage.getItem('abdelgaleel_name');
        }
        if (localStorage.getItem('abdelgaleel_phone')) {
            document.getElementById('customerPhone').value = localStorage.getItem('abdelgaleel_phone');
        }
        if (localStorage.getItem('abdelgaleel_address')) {
            document.getElementById('customerAddress').value = localStorage.getItem('abdelgaleel_address');
        }
    };

    function sendOrder(event) {
        event.preventDefault();

        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const address = document.getElementById('customerAddress').value.trim();
        const items = document.getElementById('orderItems').value.trim();

        // حفظ البيانات في متصفح العميل لاستخدامها مستقبلاً
        localStorage.setItem('abdelgaleel_name', name);
        localStorage.setItem('abdelgaleel_phone', phone);
        localStorage.setItem('abdelgaleel_address', address);

        const ownerWhatsAppNumber = "201066800808";

        // صيغة الرسالة الموجهة إلى سوبرماركت عبد الجليل
        const message = `🛒 *طلب جديد - سوبرماركت عبد الجليل* 🛒\n\n` +
                        `👤 *الاسم:* ${name}\n` +
                        `📞 *الهاتف:* ${phone}\n` +
                        `📍 *العنوان:* ${address}\n\n` +
                        `🛍️ *الأصناف المطلوبة:*\n${items}`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappURL = `https://wa.me/${ownerWhatsAppNumber}?text=${encodedMessage}`;

        window.open(whatsappURL, '_blank');
    }
</script>

</body>
</html>
