<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوبرماركت عبد الجليل - طلب أوردر</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #eef2f5;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }
        .header h1 {
            color: #1b4332;
            margin: 0 0 5px 0;
            font-size: 22px;
        }
        .header p {
            color: #666;
            margin: 0;
            font-size: 13px;
        }
        .section-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            color: #444;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #25d366;
        }
        
        /* قسم إضافة الأصناف */
        .item-input-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #bbb;
            margin-bottom: 15px;
        }
        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .add-row input[type="text"] {
            flex: 2;
        }
        .add-row input[type="text"].qty {
            flex: 1;
        }
        .btn-add {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }
        .btn-add:hover {
            background-color: #219150;
        }

        /* قائمة الأصناف المضافة */
        .items-list {
            margin-bottom: 15px;
        }
        .item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .item-details {
            font-size: 14px;
        }
        .item-name {
            font-weight: bold;
            color: #1b4332;
        }
        .item-qty {
            color: #666;
            font-size: 12px;
            margin-right: 5px;
        }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        /* زر الإرسال */
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }
        .empty-msg {
            color: #888;
            font-size: 13px;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛒 سوبرماركت عبد الجليل</h1>
        <p>قم بإضافة أصناف طلبك ثم اضغط إرسال للواتساب</p>
    </div>

    <!-- بيانات العميل -->
    <div class="form-group">
        <label>الاسم الكريم:</label>
        <input type="text" id="customerName" placeholder="اسمك الكامل">
    </div>

    <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" id="customerPhone" placeholder="رقم الموبايل">
    </div>

    <div class="form-group">
        <label>العنوان بالتفصيل:</label>
        <input type="text" id="customerAddress" placeholder="المنطقة، الشارع، رقم العمارة">
    </div>

    <hr style="border: none; border-top: 1px solid #eee; margin: 15px 0;">

    <!-- كتابة وإضافة صنف -->
    <div class="section-title">إضافة أصناف الطلب:</div>
    <div class="item-input-box">
        <div class="add-row">
            <input type="text" id="inputItemName" placeholder="اسم الصنف (مثلاً: سكر)">
            <input type="text" id="inputItemQty" class="qty" placeholder="الكمية (مثلاً: 2 كيلو)">
        </div>
        <button type="button" class="btn-add" id="btnAdd">
            + إضافة الصنف للقائمة
        </button>
    </div>

    <!-- قائمة الأصناف التي تم إضافتها -->
    <div class="section-title">الأصناف المضافة للطلب (<span id="itemsCount">0</span>):</div>
    <div id="itemsContainer" class="items-list">
        <div class="empty-msg" id="emptyMsg">لم تقم بإضافة أي أصناف بعد.</div>
    </div>

    <button type="button" class="btn-whatsapp" id="btnSend">
        إرسال الطلب عبر الواتساب 📱
    </button>
</div>

<script>
    // مصفوفة لحفظ الأصناف
    let itemsList = [];

    // استرجاع البيانات عند فتح الصفحة
    window.onload = function() {
        if (localStorage.getItem('abdelgaleel_name')) {
            document.getElementById('customerName').value = localStorage.getItem('abdelgaleel_name');
        }
        if (localStorage.getItem('abdelgaleel_phone')) {
            document.getElementById('customerPhone').value = localStorage.getItem('abdelgaleel_phone');
        }
        if (localStorage.getItem('abdelgaleel_address')) {
            document.getElementById('customerAddress').value = localStorage.getItem('abdelgaleel_address');
        }
    };

    // ربط الأحداث بالأزرار بصورة مضمونة
    document.getElementById('btnAdd').onclick = function() {
        const nameInput = document.getElementById('inputItemName');
        const qtyInput = document.getElementById('inputItemQty');

        const nameVal = nameInput.value.trim();
        const qtyVal = qtyInput.value.trim();

        if (nameVal === "") {
            alert("يرجى كتابة اسم الصنف أولاً!");
            return;
        }

        // إضافة الصنف للمصفوفة
        itemsList.push({
            name: nameVal,
            qty: qtyVal !== "" ? qtyVal : "1"
        });

        // تفريغ الحقول
        nameInput.value = "";
        qtyInput.value = "";
        nameInput.focus();

        // تحديث عرض القائمة
        renderItems();
    };

    // إعادة رسم قائمة الأصناف
    function renderItems() {
        const container = document.getElementById('itemsContainer');
        const countSpan = document.getElementById('itemsCount');
        
        countSpan.textContent = itemsList.length;

        if (itemsList.length === 0) {
            container.innerHTML = '<div class="empty-msg">لم تقم بإضافة أي أصناف بعد.</div>';
            return;
        }

        let html = '';
        itemsList.forEach((item, index) => {
            html += `
                <div class="item-card">
                    <div class="item-details">
                        <span class="item-name">• ${item.name}</span>
                        <span class="item-qty">(${item.qty})</span>
                    </div>
                    <button class="btn-delete" onclick="removeItem(${index})">حذف ❌</button>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // حذف صنف
    function removeItem(index) {
        itemsList.splice(index, 1);
        renderItems();
    }

    // إرسال الطلب إلى الواتساب
    document.getElementById('btnSend').onclick = function() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const address = document.getElementById('customerAddress').value.trim();

        if (name === "" || phone === "" || address === "") {
            alert("يرجى ملء الاسم، رقم الهاتف، والعنوان قبل الإرسال!");
            return;
        }

        if (itemsList.length === 0) {
            alert("يرجى إضافة صنف واحد على الأقل للطلب!");
            return;
        }

        // حفظ بيانات العميل في المتصفح
        localStorage.setItem('abdelgaleel_name', name);
        localStorage.setItem('abdelgaleel_phone', phone);
        localStorage.setItem('abdelgaleel_address', address);

        // صياغة قائمة الأصناف
        let formattedItems = "";
        itemsList.forEach((item, index) => {
            formattedItems += `${index + 1}. ${item.name} - (الكمية: ${item.qty})\n`;
        });

        const ownerWhatsAppNumber = "201066800808";

        const message = `🛒 *طلب جديد - سوبرماركت عبد الجليل* 🛒\n\n` +
                        `👤 *الاسم:* ${name}\n` +
                        `📞 *الهاتف:* ${phone}\n` +
                        `📍 *العنوان:* ${address}\n\n` +
                        `🛍️ *الأصناف المطلوبة:*\n${formattedItems}`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappURL = `https://wa.me/${ownerWhatsAppNumber}?text=${encodedMessage}`;

        window.open(whatsappURL, '_blank');
    };
</script>

</body>
</html>
